[package]
name = "propvim"
version = "0.1.0"
edition = "2021"
description = "Proportional Neovim GUI for macOS"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
nvim-rs = { version = "0.9", features = ["use_tokio"] }
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "io-util", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
rmpv = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
